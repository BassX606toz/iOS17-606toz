name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest

    env:
      SKIP_JDK_VERSION_CHECK: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # cmdline-tools terbaru butuh JDK 17; AGP 7.3.1 di project ini pakai JDK 11.
          cmdline-tools-version: '8512546'
          # Paket 'tools' sudah dihapus Google -> jangan dipasang.
          packages: 'platform-tools'
        env:
          SKIP_JDK_VERSION_CHECK: 'true'

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-32" \
            "build-tools;32.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build all release variants
        run: ./gradlew assembleApiQRelease assembleApiRRelease assembleApiSRelease --stacktrace --no-daemon

      - name: List APKs
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios17-606toz-apks
          path: |
            app/build/outputs/apk/apiQ/release/*.apk
            app/build/outputs/apk/apiR/release/*.apk
            app/build/outputs/apk/apiS/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: iOS17 606toz ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/apiQ/release/*.apk
            app/build/outputs/apk/apiR/release/*.apk
            app/build/outputs/apk/apiS/release/*.apk
