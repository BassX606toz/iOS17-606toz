<svg xmlns="http://www.w3.org/2000/svg" width="280" height="44" viewBox="0 0 280 44" role="img" aria-label="Optimized for legacy Android - build ready">
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ee7ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5ee7ff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#5ee7ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="280" height="44" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="280" height="44" fill="url(#s)"/>
    <rect x="0" y="0" width="280" height="44" fill="url(#scan)">
      <animate attributeName="x" values="-280;280" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="24" cy="22" r="6" fill="#34d399">
      <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="24" cy="22" r="11" fill="none" stroke="#34d399" stroke-width="1.5">
      <animate attributeName="r" values="6;14;6" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="27" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#dbeafe">LEGACY-READY  ·  R8 ON</text>
  </g>
  <rect x=".5" y=".5" width="279" height="43" rx="21.5" fill="none" stroke="#5ee7ff" stroke-opacity=".35"/>
</svg>
