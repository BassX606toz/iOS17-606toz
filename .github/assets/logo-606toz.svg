<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="606toz Community logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ee7ff"><animate attributeName="stop-color" values="#5ee7ff;#a78bfa;#ff7ac6;#5ee7ff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#7c3aed"><animate attributeName="stop-color" values="#7c3aed;#0ea5e9;#db2777;#7c3aed" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"><animate attributeName="stop-color" values="#e0f2fe;#ede9fe;#fce7f3;#e0f2fe" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5ee7ff" flood-opacity=".35"/>
    </filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- squircle -->
  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="36" y="36" width="440" height="440" rx="112" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="3"/>
  <rect x="52" y="52" width="408" height="408" rx="98" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>

  <!-- orbiting pulse rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2">
    <circle cx="256" cy="256" r="170">
      <animate attributeName="r" values="150;205;150" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".5;0;.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="256" r="170">
      <animate attributeName="r" values="150;205;150" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".5;0;.5" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orbiting dots -->
  <g>
    <circle r="8" fill="#5ee7ff">
      <animateMotion dur="6s" repeatCount="indefinite" path="M256 96 A160 160 0 1 1 255.9 96"/>
    </circle>
    <circle r="6" fill="#ff7ac6">
      <animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M256 416 A160 160 0 1 1 256.1 416"/>
    </circle>
  </g>

  <!-- wordmark -->
  <text x="256" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800" letter-spacing="-6" fill="url(#word)" filter="url(#glow)">606toz</text>
  <text x="256" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="10" fill="#ffffff" fill-opacity=".85">COMMUNITY</text>

  <!-- little sparkles -->
  <g fill="#ffffff">
    <circle cx="126" cy="150" r="4"><animate attributeName="opacity" values="1;.15;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="398" cy="372" r="4"><animate attributeName="opacity" values="1;.15;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="392" cy="126" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
